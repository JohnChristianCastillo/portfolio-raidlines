# Refresh the snapshot and publish it, daily.
#
# Runs on GitHub rather than a machine at home. Public repositories get unlimited
# Actions minutes, which matters here because the job can spend hours asleep:
# Warcraft Logs allows 3600 points an hour. A warm pass, most fights already in the
# response cache, takes minutes to an hour. A cold one, after a patch reshuffles the
# rankings, needs roughly 28,000 points, about eight hours, which is more than one
# job may run. The snapshot therefore stops itself in time to publish, and the
# cache is saved even on failure, so the next day carries on rather than starting
# over.
#
# The loop: snapshot, force-push the data branch, push an empty commit to main.
# Cloudflare builds on a push to main and fetches the data branch itself, so that
# last step is what makes any of this reach the site.

name: Refresh snapshot

on:
  schedule:
    # 04:00 UTC daily. EU raids reset Wednesday morning, and this lands after the
    # first night of pulls on every timezone that matters.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      specs:
        description: "Space-separated spec keys, or blank for all of them"
        required: false
        default: ""
      force:
        description: "Rebuild boards that already exist"
        type: boolean
        default: true

concurrency:
  # One refresh at a time. Two would race on the data branch and on main, and the
  # second would spend its life rate-limited by the first.
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The ceiling is six hours. The snapshot stops starting boards well before
    # this (SNAPSHOT_MINUTES below), so publishing always has time to run.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          # The job pushes to main at the end, so it needs a real token and the
          # ability to fast-forward first.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore the API response cache
        # A logged fight never changes, so a cached response is correct forever.
        # Without this every run re-fetches every fight and takes far longer for
        # exactly the same output. Restore and save are separate steps so the save
        # can run on failure too: see the last step.
        uses: actions/cache/restore@v4
        with:
          path: backend/data/cache
          key: wcl-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wcl-cache-

      - name: Fetch the existing snapshot
        # Start from what is already published so an interrupted run resumes rather
        # than starting over. Without --force the snapshot skips these entirely.
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            mkdir -p frontend/public
            rm -rf frontend/public/data
            # git archive, not git checkout. `git checkout FETCH_HEAD -- data` writes
            # the files AND stages them, and moving them afterwards does not unstage
            # anything, so the supposedly empty trigger commit at the end carried the
            # entire snapshot onto main. git archive never touches the index.
            git archive FETCH_HEAD data | tar -x
            mv data frontend/public/data
            echo "resuming from $(find frontend/public/data -name '*.json' | wc -l) files"
          else
            echo "no data branch yet, starting fresh"
          fi

      - name: Snapshot
        working-directory: backend
        env:
          # Without this the step prints nothing for hours. Python buffers stdout
          # when it is not a terminal, so a job that is working looks identical to
          # one that has hung, and the whole log arrives at the end or not at all.
          PYTHONUNBUFFERED: "1"
          RAIDLINES_WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          RAIDLINES_WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          RAIDLINES_BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          RAIDLINES_BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # Minutes of boards before the snapshot stops and finishes up. Leaves about
          # fifty of the job's 350 for setup, boss timelines, tooltips, publishing
          # and saving the cache.
          SNAPSHOT_MINUTES: "290"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" != "false" ]; then ARGS="$ARGS --force"; fi
          # One deadline for the whole step, shared by every per-spec invocation.
          END=$(( $(date +%s) + SNAPSHOT_MINUTES * 60 ))
          left() { echo $(( (END - $(date +%s)) / 60 )); }
          if [ -n "${{ github.event.inputs.specs }}" ]; then
            for s in ${{ github.event.inputs.specs }}; do
              python tools/snapshot.py --spec "$s" --stop-after "$(left)" $ARGS
            done
          else
            python tools/snapshot.py --stop-after "$(left)" $ARGS
          fi

      - name: Publish the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-data.sh

      - name: Trigger the Cloudflare rebuild
        # Cloudflare builds on a push to main. Publishing the data branch alone
        # changes nothing that it watches, so without this the site would keep
        # serving the previous snapshot.
        run: |
          # --allow-empty permits an empty commit, it does not force one: anything
          # left staged would be committed. Clear the index first so this can only
          # ever be the marker it is meant to be.
          git reset --quiet
          git status --porcelain
          git pull --ff-only
          git commit --allow-empty -m "Refresh snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git show --stat --oneline HEAD | tail -1
          git push origin HEAD:main

      - name: Save the API response cache
        # Runs even when an earlier step failed or the job was cancelled. Every
        # response fetched is paid for in points. When a run that had fetched for
        # four hours failed, the combined cache action threw all of it away, and
        # the next run would have started cold and hit the same wall.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data/cache
          key: wcl-cache-${{ github.run_id }}-${{ github.run_attempt }}
